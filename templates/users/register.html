<!DOCTYPE html>
<html>
<head>

    <title>Registro - Hunter vs Preys</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f8;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:12px;
            width:450px;
            box-shadow:0 4px 15px rgba(0,0,0,.15);
        }

        h1{
            text-align:center;
            color:#1976d2;
        }

        p{
            margin-bottom:15px;
        }

        input,
        select{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#1976d2;
            color:white;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#1565c0;
        }

        .footer{
            margin-top:20px;
            text-align:center;
        }

        .footer a{
            text-decoration:none;
            color:#1976d2;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="card">

    <h1>
        Hunter vs Preys
    </h1>

    <h3 style="text-align:center;">
        Registro de Jugador
    </h3>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Crear Cuenta
        </button>

    </form>

    <div class="footer">

        ¿Ya tienes una cuenta?

        <br><br>

        <a href="{% url 'login' %}">
            Iniciar Sesión
        </a>

    </div>

</div>

</body>
</html>
