<!DOCTYPE html>
<html>
<head>

    <title>Login - Hunter vs Preys</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f8;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }

        .card{
            background:white;
            padding:40px;
            width:400px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,.15);
        }

        h1{
            text-align:center;
            color:#1976d2;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            background:#1976d2;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#1565c0;
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:10px;
        }

        .footer{
            text-align:center;
            margin-top:20px;
        }

        .footer a{
            text-decoration:none;
            color:#1976d2;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="card">

    <h1>
        Hunter vs Preys
    </h1>

    <h3 style="text-align:center;">
        Iniciar Sesión
    </h3>

    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>
            Usuario
        </label>

        <input
            type="text"
            name="username"
            required
        >

        <label>
            Contraseña
        </label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

    <div class="footer">

        ¿No tienes cuenta?

        <br><br>

        <a href="{% url 'register' %}">
            Registrarse
        </a>

    </div>

</div>

</body>
</html>
