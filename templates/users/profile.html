<!DOCTYPE html>
<html>
<head>

    <title>Mi Perfil</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f8;
            margin:40px;
        }

        .card{
            background:white;
            max-width:700px;
            margin:auto;
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,.1);
        }

        h1{
            color:#1976d2;
            text-align:center;
        }

        .profile-info{
            margin-top:30px;
        }

        .row{
            padding:12px;
            border-bottom:1px solid #ddd;
        }

        .label{
            font-weight:bold;
            color:#444;
        }

        .color-box{
            display:inline-block;
            width:20px;
            height:20px;
            border-radius:50%;
            margin-left:10px;
            vertical-align:middle;
            border:1px solid #999;
        }

        .actions{
            margin-top:30px;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .btn{
            padding:12px 18px;
            text-decoration:none;
            color:white;
            border-radius:6px;
            font-weight:bold;
        }

        .blue{
            background:#1976d2;
        }

        .green{
            background:#2e7d32;
        }

        .orange{
            background:#ef6c00;
        }

        .red{
            background:#c62828;
        }

    </style>

</head>
<body>

<div class="card">

    <h1>
        Mi Perfil
    </h1>

    <div class="profile-info">

        <div class="row">
            <span class="label">
                Usuario:
            </span>
            {{ profile.user.username }}
        </div>

        <div class="row">
            <span class="label">
                Correo:
            </span>
            {{ profile.user.email }}
        </div>

        <div class="row">
            <span class="label">
                Nickname:
            </span>
            {{ profile.nickname }}
        </div>

        <div class="row">
            <span class="label">
                Color:
            </span>

            {{ profile.color }}

            <span
                class="color-box"
                style="background:{{ profile.color }};"
            ></span>
        </div>

        <div class="row">
            <span class="label">
                Fecha de registro:
            </span>

            {{ profile.created_at }}
        </div>

    </div>

    <div class="actions">

        <a
            href="{% url 'dashboard' %}"
            class="btn blue"
        >
            Dashboard
        </a>

        <a
            href="{% url 'lobby' %}"
            class="btn green"
        >
            Lobby
        </a>

        <a
            href="{% url 'game_list' %}"
            class="btn orange"
        >
            Historial
        </a>

        <a
            href="{% url 'logout' %}"
            class="btn red"
        >
            Cerrar Sesión
        </a>

    </div>

</div>

</body>
</html>
